services:
  ragqa:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # mail.db, ChromaDB(storage/chroma), 메일 토큰 캐시(token_cache.bin)
      # schema.sql도 이 폴더에 있어야 하므로 프로젝트의 storage/를 그대로 붙인다.
      - ./storage:/app/storage
      # 업로드 원본(data/uploads), PDF에서 뽑은 이미지(data/images)
      - ./data:/app/data
      # 리랭커 등 HF 모델 캐시 (Dockerfile의 HF_HOME)
      - hf_cache:/app/.cache/huggingface
    env_file:
      - .env
    environment:
      # langchain-ollama(OllamaEmbeddings)는 OLLAMA_HOST를 읽는다
      - OLLAMA_HOST=http://host.docker.internal:11434
    extra_hosts:
      # 리눅스 Docker에서도 host.docker.internal이 호스트를 가리키게 한다
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  hf_cache:
