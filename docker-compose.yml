services:
  ragqa:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # mail.db, ChromaDB(storage/chroma), 메일 토큰 캐시(token_cache.bin)
      # schema.sql도 이 폴더에 있어야 하므로 프로젝트의 storage/를 그대로 붙인다.
      - ./storage:/app/storage
      # 업로드 원본(data/uploads), PDF에서 뽑은 이미지(data/images)
      - ./data:/app/data
      # 리랭커 등 HF 모델 캐시 (Dockerfile의 HF_HOME)
      - hf_cache:/app/.cache/huggingface
    env_file:
      - .env
    environment:
      # 임베딩(bge-m3)은 아래 ollama 컨테이너가 맡는다. langchain-ollama는 OLLAMA_HOST를 읽는다.
      - OLLAMA_HOST=http://ollama:11434
    extra_hosts:
      # 같은 서버의 vLLM 등 호스트 서비스를 host.docker.internal로 부를 수 있게 한다 (리눅스용)
      - "host.docker.internal:host-gateway"
    depends_on:
      - ollama
    restart: unless-stopped

  # 임베딩 전용 Ollama. 모델은 처음 한 번 받아야 한다:
  #   docker compose exec ollama ollama pull bge-m3
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    # GPU로 돌리려면 주석 해제 (nvidia-container-toolkit 필요, vLLM과 VRAM을 나눠 씀)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  hf_cache:
  ollama_models:
