<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>RAG PDF 업로드</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, "Segoe UI", Malgun Gothic, sans-serif;
    max-width: 760px;
    margin: 40px auto;
    padding: 0 16px;
    line-height: 1.5;
  }
  h1 { font-size: 20px; }
  #dropzone {
    border: 2px dashed #888;
    border-radius: 8px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    color: #666;
  }
  #dropzone.drag { border-color: #3b82f6; color: #3b82f6; }
  #fileInput { display: none; }
  #fileList { margin: 12px 0; font-size: 14px; }
  button {
    margin-top: 12px;
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    background: #3b82f6;
    color: white;
    cursor: pointer;
    font-size: 14px;
  }
  button:disabled { background: #aaa; cursor: not-allowed; }
  #status { margin-top: 12px; font-size: 14px; color: #555; }
  .result {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 12px 16px;
    margin-top: 16px;
  }
  .result h3 { margin: 0 0 4px; font-size: 15px; }
  .result .meta { font-size: 13px; color: #777; margin-bottom: 8px; }
  .error { color: #d33; }
  details { margin-top: 8px; }
  .chunk {
    border-top: 1px solid #eee;
    padding: 6px 0;
    font-size: 13px;
  }
  .chunk .id { color: #999; margin-right: 6px; }
  .chunk.expandable { cursor: pointer; }
  .chunk.expandable:hover { background: rgba(59, 130, 246, 0.06); }
  .chunk .text { white-space: pre-wrap; }
  hr { margin: 32px 0; border: none; border-top: 1px solid #ddd; }
  #searchBox { display: flex; gap: 8px; }
  #queryInput {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
  }
  #searchBox button { margin-top: 0; }
  .searchResult {
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 14px;
    margin-top: 10px;
    font-size: 13px;
  }
  .searchResult .meta { color: #777; margin-bottom: 4px; }
  .answer {
    border: 1px solid #3b82f6;
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 12px;
    font-size: 14px;
  }
  .sources { margin-top: 10px; }
  .answer h1, .answer h2, .answer h3 { margin: 12px 0 6px; }
  .answer p { margin: 6px 0; }
  .answer ul, .answer ol { margin: 6px 0; padding-left: 22px; }
  .answer li { margin: 2px 0; }
  .answer code { background: rgba(0,0,0,0.06); padding: 1px 4px; border-radius: 4px; font-size: 13px; }
  .answer pre { background: rgba(0,0,0,0.06); padding: 10px; border-radius: 6px; overflow-x: auto; }
  .answer pre code { background: none; padding: 0; }
  .answer strong { font-weight: 700; }
  .answer table { border-collapse: collapse; margin: 8px 0; }
  .answer table th, .answer table td { border: 1px solid #ccc; padding: 4px 8px; }

  /* 모드 토글 */
  #modeToggle {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #555;
  }
  .switch {
    position: relative;
    display: inline-block;
    width: 42px;
    height: 22px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background-color: #ccc;
    transition: .2s;
    border-radius: 22px;
  }
  .slider::before {
    position: absolute;
    content: "";
    height: 16px;
    width: 16px;
    left: 3px;
    bottom: 3px;
    background-color: white;
    transition: .2s;
    border-radius: 50%;
  }
  .switch input:checked + .slider { background-color: #3b82f6; }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  #modeLabel { font-weight: 600; }
  #modeLabel[data-mode="claude"] { color: #3b82f6; }
  #modeLabel[data-mode="local"] { color: #16a34a; }

  /* 검색/리랭킹 파라미터 컨트롤 */
  #paramControls {
    display: flex;
    gap: 16px;
    margin-bottom: 12px;
    font-size: 13px;
    color: #555;
    flex-wrap: wrap;
  }
  #paramControls label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #paramControls input[type="number"] {
    width: 56px;
    padding: 4px 6px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 13px;
  }
  #paramWarning {
    font-size: 12px;
    color: #d33;
    margin-bottom: 8px;
    display: none;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
  <h1>PDF 업로드 → RAG 파싱/청킹</h1>
  <p>PDF 파일을 업로드하면 텍스트를 추출하고 기본 청킹을 수행합니다. (이미지는 무시)</p>

  <div id="dropzone">
    파일을 드래그하거나 클릭해서 선택하세요 (PDF, 여러 개 가능)
    <input id="fileInput" type="file" accept="application/pdf" multiple />
  </div>
  <div id="fileList"></div>
  <button id="uploadBtn" disabled>업로드 및 처리</button>
  <div id="status"></div>
  <div id="results"></div>

  <hr />

  <h1>질문하기</h1>
  <p>업로드된 문서를 근거로 AI 에이전트(그래프)가 답변을 생성합니다.</p>

  <div id="modeToggle">
    <span id="modeLabel" data-mode="claude">Claude 모드</span>
    <label class="switch">
      <input type="checkbox" id="modeSwitch" />
      <span class="slider"></span>
    </label>
    <span style="color:#999;">(끔: Claude API · 켬: 로컬 모델)</span>
  </div>

  <div id="paramControls">
    <label>
      검색 개수 (query_top_n)
      <input type="number" id="queryTopN" value="5" min="1" max="50" />
    </label>
    <label>
      리랭킹 개수 (rerank_top_n)
      <input type="number" id="rerankTopN" value="3" min="1" max="50" />
    </label>
  </div>
  <div id="paramWarning">⚠ rerank_top_n은 query_top_n보다 작거나 같아야 합니다.</div>

  <div id="searchBox">
    <input id="queryInput" type="text" placeholder="질문을 입력하세요" />
    <button id="searchBtn">질문하기</button>
  </div>
  <div id="searchStatus"></div>
  <div id="searchResults"></div>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileListEl = document.getElementById('fileList');
const uploadBtn = document.getElementById('uploadBtn');
const statusEl = document.getElementById('status');
const resultsEl = document.getElementById('results');

let selectedFiles = [];

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('drag');
  setFiles(e.dataTransfer.files);
});
fileInput.addEventListener('change', () => setFiles(fileInput.files));

function setFiles(fileListLike) {
  selectedFiles = Array.from(fileListLike).filter(f => f.name.toLowerCase().endsWith('.pdf'));
  fileListEl.textContent = selectedFiles.length
    ? `선택된 파일: ${selectedFiles.map(f => f.name).join(', ')}`
    : 'PDF 파일을 선택해주세요.';
  uploadBtn.disabled = selectedFiles.length === 0;
}

uploadBtn.addEventListener('click', async () => {
  if (!selectedFiles.length) return;
  uploadBtn.disabled = true;
  statusEl.textContent = '처리 중...';
  resultsEl.innerHTML = '';

  const formData = new FormData();
  for (const f of selectedFiles) formData.append('files', f);

  try {
    const res = await fetch('/upload', { method: 'POST', body: formData });
    if (!res.ok) throw new Error(`서버 오류 (${res.status})`);
    const data = await res.json();
    renderResults(data.results);
    statusEl.textContent = '완료';
  } catch (err) {
    statusEl.textContent = '실패: ' + err.message;
  } finally {
    uploadBtn.disabled = false;
  }
});

function renderResults(results) {
  resultsEl.innerHTML = '';
  for (const r of results) {
    const div = document.createElement('div');
    div.className = 'result';
    if (r.error) {
      div.innerHTML = `<h3>${escapeHtml(r.filename ?? '(unknown)')}</h3><div class="error">${escapeHtml(r.error)}</div>`;
      resultsEl.appendChild(div);
      continue;
    }
    const chunksHtml = r.chunks.map(c => `
      <div class="chunk"><span class="id">[${escapeHtml(c.id)}] p${c.page}</span>${escapeHtml(c.text.slice(0, 200))}${c.text.length > 200 ? '…' : ''}</div>
    `).join('');
    div.innerHTML = `
      <h3>${escapeHtml(r.filename)}</h3>
      <div class="meta">청크 ${r.num_chunks}개 · 저장 위치: ${escapeHtml(r.chunks_saved_to)}</div>
      <details><summary>청크 미리보기</summary>${chunksHtml}</details>
    `;
    resultsEl.appendChild(div);
  }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

const queryInput = document.getElementById('queryInput');
const searchBtn = document.getElementById('searchBtn');
const searchStatusEl = document.getElementById('searchStatus');
const searchResultsEl = document.getElementById('searchResults');
const modeSwitch = document.getElementById('modeSwitch');
const modeLabel = document.getElementById('modeLabel');
const queryTopNInput = document.getElementById('queryTopN');
const rerankTopNInput = document.getElementById('rerankTopN');
const paramWarningEl = document.getElementById('paramWarning');

modeSwitch.addEventListener('change', () => {
  const mode = modeSwitch.checked ? 'local' : 'claude';
  modeLabel.textContent = mode === 'local' ? '로컬 모드' : 'Claude 모드';
  modeLabel.dataset.mode = mode;
});

function checkParamWarning() {
  const queryTopN = Number(queryTopNInput.value) || 0;
  const rerankTopN = Number(rerankTopNInput.value) || 0;
  const invalid = rerankTopN > queryTopN;
  paramWarningEl.style.display = invalid ? 'block' : 'none';
  return !invalid;
}
queryTopNInput.addEventListener('input', checkParamWarning);
rerankTopNInput.addEventListener('input', checkParamWarning);

searchBtn.addEventListener('click', askQuestion);
queryInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') askQuestion();
});

async function askQuestion() {
  const q = queryInput.value.trim();
  if (!q) return;
  if (!checkParamWarning()) return;

  const mode = modeSwitch.checked ? 'local' : 'claude';
  const query_top_n = Number(queryTopNInput.value) || 5;
  const rerank_top_n = Number(rerankTopNInput.value) || 3;

  searchBtn.disabled = true;
  searchStatusEl.textContent = '답변 생성 중...';
  searchResultsEl.innerHTML = '';

  try {
    const res = await fetch('/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, mode, query_top_n, rerank_top_n }),
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `서버 오류 (${res.status})`);
    }
    const data = await res.json();
    renderAnswer(data);
    searchStatusEl.textContent = '완료';
  } catch (err) {
    searchStatusEl.textContent = '실패: ' + err.message;
  } finally {
    searchBtn.disabled = false;
  }
}

function renderAnswer(data) {
  searchResultsEl.innerHTML = '';

  const answerDiv = document.createElement('div');
  answerDiv.className = 'answer';
  const answerText = data.answer || '(답변이 비어 있습니다)';
  answerDiv.innerHTML = (typeof marked !== 'undefined')
    ? marked.parse(answerText)
    : escapeHtml(answerText);
  searchResultsEl.appendChild(answerDiv);

  if (!data.sources || !data.sources.length) return;

  const sourcesDiv = document.createElement('div');
  sourcesDiv.className = 'sources';
  const chunksHtml = data.sources.map((s, i) => {
    const isLong = s.text.length > 200;
    return `
    <div class="chunk${isLong ? ' expandable' : ''}" data-index="${i}" data-expanded="false">
      <span class="id">${escapeHtml(s.source)} p${s.page}</span>
      <span class="text">${escapeHtml(isLong ? s.text.slice(0, 200) + '…' : s.text)}</span>
    </div>
  `;
  }).join('');
  sourcesDiv.innerHTML = `<details><summary>참고한 청크 (${data.sources.length}개)</summary>${chunksHtml}</details>`;
  searchResultsEl.appendChild(sourcesDiv);

  // 클릭 시 전체 텍스트 <-> 요약 토글
  sourcesDiv.querySelectorAll('.chunk.expandable').forEach((el) => {
    el.addEventListener('click', () => {
      const idx = Number(el.dataset.index);
      const full = data.sources[idx].text;
      const expanded = el.dataset.expanded === 'true';
      const textSpan = el.querySelector('.text');
      if (expanded) {
        textSpan.textContent = full.slice(0, 200) + '…';
        el.dataset.expanded = 'false';
      } else {
        textSpan.textContent = full;
        el.dataset.expanded = 'true';
      }
    });
  });
}
</script>
</body>
</html>
